name: CI

on:
  push:
    branches: [5.x, main, master]
  pull_request:
    branches: [5.x, main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, tokenizer, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run package and sandbox tests
        run: |
          chmod +x scripts/ci.sh scripts/ci-package.sh scripts/ci-sandbox.sh
          scripts/ci.sh

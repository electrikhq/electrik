name: CI

on:
  push:
    branches: [5.x, main, master]
  pull_request:
    branches: [5.x, main, master]

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout monorepo (electrik + sandbox)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, tokenizer, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run sandbox tests
        run: |
          chmod +x electrik/scripts/ci-sandbox.sh
          electrik/scripts/ci-sandbox.sh
